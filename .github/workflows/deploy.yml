# CI/CD handled by Vercel GitHub integration.
# main branch   → Production deployment  (REACT_APP_API_URL = https://api.<domain>)
# staging branch → Preview deployment    (REACT_APP_API_URL = https://staging-api.<domain>)
#
# Setup checklist:
# 1. Connect this repo to a Vercel project via vercel.com
# 2. Set Production Branch = main in Vercel project settings
# 3. Add staging as an additional branch that triggers Preview deployments
# 4. Set environment variables in Vercel per environment (Production vs Preview):
#    REACT_APP_API_URL, REACT_APP_API_BASE_URL, REACT_APP_ENV
